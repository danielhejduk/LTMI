[package]
name = "ltmi"
version = "0.1.0"
edition = "2024"

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dependencies.smithay]
version = "0.7.0"
default-features = false
features = ["backend_winit", "wayland_frontend", "desktop"]

[profile.release]
lto = true
strip = true
codegen-units = 1
